name: Graffiti Kings site audit

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out site
        uses: actions/checkout@v4
      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify JavaScript syntax
        run: |
          node --check js/main.js
          node --check scripts/check-live-seo.mjs
      - name: Test live SEO crawler using an offline fixture
        run: node --test tests/check-live-seo.test.mjs
      - name: Audit internal links and SEO
        run: node scripts/check-site.mjs
      - name: Validate social metadata, schema and technical SEO
        run: node scripts/check-seo.mjs
