<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" style="background:#0a0a0a">
  <defs>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <text x="400" y="130" font-family="Arial Black, sans-serif" font-size="80" font-weight="900" fill="#FFD700" text-anchor="middle" filter="url(#glow)" letter-spacing="8">GKniftyHEADS</text>
  <text x="400" y="170" font-family="Arial, sans-serif" font-size="18" fill="#00FFFF" text-anchor="middle" letter-spacing="5">OFFICIAL WIKI • EST. 1983</text>
</svg>
